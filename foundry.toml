[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Matches the Gas Killer org floor: eigenlayer-middleware pins 0.8.27, so anything
# that will eventually link against GasKillerSDK has to compile at or above it.
solc_version = "0.8.27"
via_ir = false
optimizer = true
optimizer_runs = 200

# GasKillerSDK's TransitionGuard is a hard EIP-1153 (transient storage) dependency,
# available from Cancun onward. Pinned rather than left to track Foundry's default so
# codegen never assumes opcodes a settlement target may not have activated.
evm_version = "cancun"

# The naive/unguarded comparison paths are deliberately gas-explosive so we can measure
# them exceeding a real block. Raise Foundry's ceilings so they can execute inside a test;
# the 30M figure asserted against lives in test code, decoupled from these.
gas_limit = "18446744073709551615"
block_gas_limit = "1000000000000"
memory_limit = 268435456

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false
call_override = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "preserve"
multiline_func_header = "attributes_first"
sort_imports = false
wrap_comments = false
